name: Validate
on: [push, pull_request]
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
          python-version: "3.12"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run lewam-train hardware=cpu data=synthetic logging.mode=disabled train.max_steps=2 output_dir=outputs/ci
      - run: uv run torchrun --standalone --nproc-per-node=2 -m lewam.cli hardware=cpu data=synthetic logging.mode=disabled train.max_steps=2 output_dir=outputs/ddp hydra.run.dir=outputs/ddp
      - run: uv run torchrun --standalone --nproc-per-node=2 tests/distributed_sigreg.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make room for CUDA dependency installation
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
